name: Release

# Push a tag like `v0.1.0` (matching [workspace.package] version in Cargo.toml) to build
# the Windows package and installer with `cargo xtask installer`, zip the package and
# publish a GitHub release. The app's updater looks for `vidar-<version>-setup.exe` and
# `<that>.sha256` on the latest release, so keep those names.
# Tags with a suffix (`v0.2.0-rc.1`) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match workspace version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: rustup toolchain install # version + components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            third_party/rnnoise/model
            third_party/onnxruntime
            models
          key: vidar-assets-${{ hashFiles('xtask/src/main.rs') }}

      # Same gate as CI: never publish a build whose tests fail.
      - run: cargo xtask fetch
      - run: cargo test --workspace --locked

      # `cargo xtask dist` generates licenses\THIRD_PARTY_LICENSES.html with cargo-about.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about

      # Inno Setup 6 builds the installer; the runner image may or may not have it.
      - name: Install Inno Setup
        run: |
          if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup -y --no-progress
          fi

      # dist\vidar (the portable folder) plus dist\vidar-<version>-setup.exe and its .sha256,
      # which the app's updater checks before running it.
      - name: Build package and installer
        run: cargo xtask installer

      - name: Zip and checksums
        shell: pwsh
        run: |
          $name = "vidar-$env:VERSION-windows-x64"
          $setup = "vidar-$env:VERSION-setup.exe"
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/vidar -DestinationPath "out/$name.zip" -CompressionLevel Optimal
          $hash = (Get-FileHash "out/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "out/$name.zip.sha256"
          Copy-Item "dist/$setup", "dist/$setup.sha256" out/
          Get-ChildItem out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vidar-release
          path: out/*
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vidar-release
          path: out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: Vidar ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: out/*
          body: |
            Windows 10 (1903+) / 11, 64-bit x86.

            **Install:** download `vidar-*-setup.exe` and run it. It installs Vidar and the
            virtual microphone (VB-CABLE) with one permission prompt, and later versions
            update from inside the app.

            **Portable:** download `vidar-*-windows-x64.zip`, extract it anywhere and run
            `vidar.exe`. On first start Vidar offers to install the virtual microphone.

            Verify a download against its `.sha256` file if you like.
