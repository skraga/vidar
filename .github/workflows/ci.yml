name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch new RustSec advisories without a code change
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Vidar is Windows-only (WASAPI, windows-rs, winresource, ONNX Runtime DLL, MSVC build of
# RNNoise), so every Rust job runs on Windows: amd64 on windows-latest, and the tests also on
# ARM64 (windows-11-arm). Linux/macOS would not compile apps/vidar.
defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # version + components from rust-toolchain.toml
      - run: cargo fmt --all --check

  # Shared by clippy/test: the RNNoise weights (78 MB, needed by build.rs), ONNX Runtime
  # and the DPDFNet model are git-ignored and fetched by `cargo xtask fetch` (SHA-256 checked).
  # They are cached, keyed on the xtask source (which pins URLs and hashes).
  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install # version + components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/rnnoise/model
            third_party/onnxruntime
            third_party/dpdfnet
          key: vidar-assets-amd64-${{ hashFiles('xtask/src/main.rs') }}
      - run: cargo xtask fetch
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The ARM64 image may not ship rustup.
      - name: Install rustup if missing
        run: |
          if ! command -v rustup >/dev/null; then
            host=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86_64)-pc-windows-msvc
            curl -sSfL -o rustup-init.exe "https://static.rust-lang.org/rustup/dist/${host}/rustup-init.exe"
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            rm rustup-init.exe
            echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - run: rustup toolchain install # version + components from rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/rnnoise/model
            third_party/onnxruntime
            third_party/dpdfnet
          key: vidar-assets-${{ matrix.arch }}-${{ hashFiles('xtask/src/main.rs') }}
      - run: cargo xtask fetch
      # Golden tests need the models above; live device tests stay off (VIDAR_LIVE_TESTS unset).
      - run: cargo test --workspace --locked

  # Non-Rust hooks from .pre-commit-config.yaml: hygiene, gitleaks, typos, ruff (bench/), actionlint.
  # The Rust hooks are covered by the fmt/clippy/deny jobs, so they are skipped here.
  pre-commit:
    name: pre-commit (lint, secrets, spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pipx run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: cargo-fmt,cargo-deny,cargo-clippy

  # The per-crate licence page that `cargo xtask dist` ships (about.toml, about.hbs). Checked on
  # every push so a crate cargo-about cannot resolve is caught before a release tag.
  about:
    name: cargo-about (licence texts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-about
      - run: cargo about generate --workspace about.hbs > THIRD_PARTY_LICENSES.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html

  # Licences, RustSec advisories, banned crates and registries, configured in deny.toml.
  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          arguments: --all-features
