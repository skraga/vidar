# cargo-about: licence texts of every Rust dependency, shipped as
# licenses\THIRD_PARTY_LICENSES.html by `cargo xtask dist`. Keep `accepted` in step with the
# allow-list in deny.toml.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
