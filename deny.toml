# cargo-deny: license, security-advisory, duplicate/banned-crate and source checks.
# Run: cargo deny check     (also runs in pre-commit on Cargo.toml/Cargo.lock changes, and in CI)
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Vidar only ships for Windows x64; ignore crates that are only pulled in for other platforms.
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# RustSec database: vulnerabilities are always errors; unmaintained/yanked crates too.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
    # { id = "RUSTSEC-0000-0000", reason = "why it does not affect us" },
]

[licenses]
version = 2
# Permissive licences compatible with shipping an MIT-licensed binary.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA list data)
    "OFL-1.1",             # epaint_default_fonts (bundled fonts)
    "Ubuntu-font-1.0",     # epaint_default_fonts (bundled fonts)
    "MPL-2.0",             # symphonia (decoder, used unmodified: file-level copyleft only)
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates that are never published (e.g. xtask) don't need a licence field.
ignore = true

[bans]
multiple-versions = "warn"
# Internal path deps (vidar-* crates) have no version; they are never published to crates.io.
wildcards = "allow"
allow-wildcard-paths = true
deny = [
    # Keep the dependency tree on rustls; no OpenSSL to bundle on Windows.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
