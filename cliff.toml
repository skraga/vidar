# git-cliff (https://git-cliff.org): turns commit messages into CHANGELOG.md sections and
# release notes. `cargo xtask changelog` previews the next section; `cargo xtask release
# <version>` writes it. Only feat, fix and perf commits appear, so write their subject line
# for people who use Vidar: what they will notice, not how it was done.

[changelog]
# Must match the top of CHANGELOG.md exactly: --prepend replaces it there.
header = """
# Changelog

What changed in each Vidar release, newest first. Sections are generated from commit
messages by [git-cliff](https://git-cliff.org) when a release is prepared
(`cargo xtask release <version>`), and each one is published as that version's GitHub
release notes.
"""
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
sort_commits = "oldest"
# Stable releases only: a pre-release's changes reappear in the release that follows it.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  # Developer-only work, whatever its type.
  { message = "^[a-z]+\\((xtask|ci|build|deps|dev|release)\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = ".*", skip = true },
]
