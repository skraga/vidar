[package]
name = "vidar-cli"
description = "Vidar command line: clean audio files, inspect and brand audio endpoints, install the cable driver"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "vidar-cli"
path = "src/main.rs"

[dependencies]
vidar-dsp.workspace = true
vidar-denoise.workspace = true
vidar-win.workspace = true
clap = { version = "4", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "flac", "mp3", "vorbis", "ogg", "aac", "isomp4", "adpcm"] }
rubato = "5"
hound = "3.5"
indicatif = "0.18"
rayon = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
vidar-brand.workspace = true
winresource = "0.1"
