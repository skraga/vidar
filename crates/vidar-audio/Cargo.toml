[package]
name = "vidar-audio"
description = "Vidar real-time engine: WASAPI capture and render, the processing chain, drift control"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vidar-dsp.workspace = true
vidar-config.workspace = true
vidar-win.workspace = true
rtrb = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
