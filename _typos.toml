# typos spell-checker config (pre-commit hook). Add project jargon here instead of renaming code.
[files]
extend-exclude = ["drivers/", "third_party/", "tests/golden/", "*.csv"]

[default.extend-words]
PN = "PN" # split from "PNGs"
formant = "formant" # a resonance of the voice
individuel = "individuel" # French, in the VB-CABLE signer name (THIRD_PARTY_NOTICES.md)
